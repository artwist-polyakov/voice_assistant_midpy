name: Locked Python checks
on: [pull_request]

permissions:
  contents: read

jobs:
  checks:
    runs-on: ubuntu-24.04
    steps:
      - name: Check out repository
        uses: actions/checkout@8e8c483db84b4bee98b60c0593521ed34d9990e8

      - name: Set up Python
        uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405
        with:
          python-version-file: .python-version
          check-latest: false

      - name: Install fixed pip
        run: >-
          python -m pip install --disable-pip-version-check --no-cache-dir --require-hashes --only-binary=:all: -r alice/requirements-bootstrap.txt

      - name: Install locked application dependencies
        run: >-
          python -m pip install --disable-pip-version-check --no-cache-dir --require-hashes --only-binary=:all: -r alice/requirements.txt

      - name: Install locked lint dependencies
        run: >-
          python -m pip install --disable-pip-version-check --no-cache-dir --require-hashes --only-binary=:all: -r ci/requirements-lint.txt

      - name: Verify application dependencies
        run: |
          python -m pip check
          PYTHONPATH=alice SENTRY_DSN='' SENTRY_ENABLE_TRACING=false python -c 'import main; assert main.app.title == "Alice Webhook"'

      - name: Run Flake8
        run: python -m flake8 .
